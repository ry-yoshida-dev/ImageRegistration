[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-registration"
version = "0.0.1"
authors = [
    { name = "Ryuto Yoshida" },
]
description = "Typed image registration library with ECC, keypoint matching, and optical flow methods."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy",
    "opencv-contrib-python",
    "projective @ git+https://github.com/ry-yoshida-dev/Projective.git",
    "opencv-keypoint @ git+https://github.com/ry-yoshida-dev/OpenCVKeypoint.git",
    "opencv-utility @ git+https://github.com/ry-yoshida-dev/OpenCVUtility.git",
    "dictconfig-handler @ git+https://github.com/ry-yoshida-dev/DictConfigHandler.git"
]

[project.urls]
Homepage = "https://github.com/ry-yoshida-dev/ImageRegistrator"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/ImageRegistrator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
image_registration = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.mypy]
mypy_path = "src"
files = ["src", "tests"]
explicit_package_bases = true
strict = true

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# Only public classes, methods, and functions need docstrings, and multi-line ones are the local style.
ignore = ["E501", "D100", "D104", "D105", "D200"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
